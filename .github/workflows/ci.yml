name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-suffix: ${{ matrix.os }}-py${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Audit locked dependencies
        run: uv audit --locked
      - name: Run release-equivalent verification
        run: uv run --no-sync python scripts/verify_release.py
